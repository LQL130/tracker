name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App (Unsigned)
        run: |
          xcodebuild build \
            -project AntTracker.xcodeproj \
            -scheme AntTracker \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Check built app
        run: |
          APP="build/DerivedData/Build/Products/Release-iphoneos/AntTracker.app"
          ls -la "$APP"
          echo "=== Bundle ID của app ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          echo "=== Widget đã được nhúng? ==="
          ls "$APP/PlugIns" || echo "Không thấy PlugIns"

      - name: Package IPA for Sideloadly
        run: |
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/AntTracker.app build/Payload/
          cd build && zip -r -y AntTracker.ipa Payload

      - name: Upload AntTracker.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntTracker-IPA
          path: build/AntTracker.ipa
