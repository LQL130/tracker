name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Ensure Bundle Identifier in Info.plist
        run: |
          /usr/libexec/PlistBuddy -c "Delete :CFBundleIdentifier" AntTracker/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string com.anttracker.app" AntTracker/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :CFBundleIdentifier" AntTrackerWidget/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string com.anttracker.app.widget" AntTrackerWidget/Info.plist

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Set Bundle Identifier in Xcode Project
        run: |
          python3 - << 'EOF'
          import re

          pbx_path = "AntTracker.xcodeproj/project.pbxproj"
          with open(pbx_path, "r") as f:
              text = f.read()

          def set_bundle_id(pbx, target_name, bundle_id):
              m = re.search(rf'([A-Za-z0-9_]+)\s*/\*\s*Build configuration list for PBXNativeTarget "{re.escape(target_name)}"\s*\*/\s*=\s*\{{[^}}]*buildConfigurations\s*=\s*\(([^)]+)\)', pbx)
              if not m:
                  raise RuntimeError(f"Target config list not found: {target_name}")
              cfg_ids = re.findall(r'^\s*([A-Za-z0-9_]+)', m.group(2), re.M)
              for cid in cfg_ids:
                  block_re = re.compile(rf'({re.escape(cid)}\s*(?:/\*[^*]*\*/)?\s*=\s*\{{[\s\S]*?buildSettings\s*=\s*\{{)([\s\S]*?)(\n\s*\}};)')
                  def repl(match):
                      header, body, footer = match.group(1), match.group(2), match.group(3)
                      if re.search(r'PRODUCT_BUNDLE_IDENTIFIER\s*=', body):
                          body = re.sub(r'(PRODUCT_BUNDLE_IDENTIFIER\s*=\s*)[^;]+;', rf'\g<1>{bundle_id};', body)
                      else:
                          body = f"\n\t\t\t\tPRODUCT_BUNDLE_IDENTIFIER = {bundle_id};" + body
                      return header + body + footer
                  pbx = block_re.sub(repl, pbx, count=1)
              return pbx

          text = set_bundle_id(text, "AntTracker", "com.anttracker.app")
          text = set_bundle_id(text, "AntTrackerWidget", "com.anttracker.app.widget")

          with open(pbx_path, "w") as f:
              f.write(text)
          EOF

      - name: Build & Archive App (Unsigned)
        run: |
          xcodebuild archive \
            -project AntTracker.xcodeproj \
            -scheme AntTracker \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/AntTracker.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA for Sideloadly
        run: |
          mkdir -p build/Payload
          cp -r build/AntTracker.xcarchive/Products/Applications/AntTracker.app build/Payload/
          cd build && zip -r AntTracker.ipa Payload

      - name: Upload AntTracker.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntTracker-IPA
          path: build/AntTracker.ipa
