    .filter(t => t.status !== 'Xong')
    .slice()
    .sort((a, b) => (a.due || '9').localeCompare(b.due || '9'));
  const nextTask = activeTasks[0];

  const now = new Date();

  const m = now.getHours() * 60 + now.getMinutes();
  const todaySlots = S.slots.filter(s => s.a && s.b && S.sched[di + '-' + s.id]);
